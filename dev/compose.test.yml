# Isolated, throw-away Odoo 20 test stack (local Docker only, never the server).
# The database lives in tmpfs; `dev/test.sh down` removes containers and volumes.
name: boss20test

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
      POSTGRES_DB: postgres
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 30

  odoo:
    image: odoo:20.0
    depends_on:
      db:
        condition: service_healthy
    environment:
      PYTHONPATH: /opt/odoo-src
    entrypoint: ["python3", "/opt/odoo-src/setup/odoo"]
    volumes:
      - ../odoo-20.0+e.20261020:/opt/odoo-src:ro
      - ../addons:/mnt/extra-addons:ro
      - odoo-data:/var/lib/odoo

volumes:
  odoo-data:
