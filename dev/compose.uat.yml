# Isolated UAT stack for the meetings (local Docker only, never the server). Unlike compose.test.yml the database
# lives on a named volume: it survives restarts and is never touched by dev/test.sh (other project name and ports).
name: boss20uat

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
      POSTGRES_DB: postgres
    volumes:
      - uat-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 30

  odoo:
    image: odoo:20.0
    depends_on:
      db:
        condition: service_healthy
    environment:
      PYTHONPATH: /opt/odoo-src
      HTTP_PROXY: http://127.0.0.1:9
      HTTPS_PROXY: http://127.0.0.1:9
      NO_PROXY: db,localhost,127.0.0.1
    entrypoint: ["python3", "/opt/odoo-src/setup/odoo"]
    volumes:
      - ../odoo-20.0+e.20261020:/opt/odoo-src:ro
      - ../addons:/mnt/extra-addons:ro
      - ../samples-private:/mnt/samples:ro
      - uat-odoo-data:/var/lib/odoo

volumes:
  uat-db:
  uat-odoo-data:
